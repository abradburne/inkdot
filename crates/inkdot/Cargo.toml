[package]
name = "inkdot"
description = "A Game Boy and Game Boy Color emulator for the Anbernic RG DS+ on nibOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
inkdot-core = { path = "../inkdot-core" }
# RetroAchievements (feature `cheevos`): rcheevos, vendored, and curl as the transport.
inkdot-cheevos = { path = "../inkdot-cheevos", optional = true }
# nibOS's SDK library (github.com/abradburne/nibkit, MIT): the screens, vblank, buttons, touch,
# brightness, paths, settings, the menu and DSlot's description format. To build against a local
# checkout, patch it in from outside the repository (CONTRIBUTING.md, "nibkit").
nibkit = { git = "https://github.com/abradburne/nibkit", tag = "v0.1.0", version = "0.1", default-features = false, features = ["menu-raster"] }
# SDL2's API, linked against the system's SDL2 (sdl2-compat on SDL3), as DSlot does.
sdl2 = "0.38"
glow = "0.14"
png = "0.17"
fontdue = "0.9"
miniz_oxide = "0.8"
libc = "0.2"

# The core forbids unsafe code; the frontend needs it for GL and a few libc calls, each with a
# SAFETY comment saying why it holds.
# The system it runs on, one of them (as nibkit's): nibOS (the default), the RG DS+'s stock OS,
# or a computer. `dslot` adds DSlot's part: options kept in DSlot's settings file, and a test
# that the description DSlot reads matches inkdot's options. inkdot runs without DSlot either way.
[features]
default = ["nibos", "cheevos"]
# On nibOS the menu has the Connections page (Wi-Fi, Bluetooth), which needs nibkit's radios.
nibos = ["nibkit/nibos", "nibkit/net-control"]
stock = ["nibkit/stock"]
# A computer: windows, keyboard, mouse (nibkit chooses it anyway on any system but Linux).
desktop = ["nibkit/desktop"]
dslot = ["nibkit/dslot"]
# RetroAchievements: signed in through DSlot (RA_TOKEN_FILE in the environment), softcore only.
# Needs a C compiler for rcheevos; the stock and desktop builds leave it out.
cheevos = ["dep:inkdot-cheevos"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
