[workspace]
members = ["crates/inkdot-core", "crates/inkdot-test", "crates/inkdot", "crates/inkdot-cheevos"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Alan Bradburne"]
repository = "https://github.com/abradburne/inkdot"
homepage = "https://github.com/abradburne/inkdot"
keywords = ["gameboy", "emulator", "gbc", "handheld", "anbernic"]
categories = ["emulators"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# The core's arithmetic on 8- and 16-bit registers is full of deliberate narrowing casts.
cast_possible_truncation = "allow"

# Tests run test ROMs for millions of cycles: unoptimised, the suite takes minutes.
[profile.test]
opt-level = 3

[profile.dev.package.inkdot-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release with symbols, for profilers: cargo build --profile profiling.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
