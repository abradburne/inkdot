# inkdot: `make check` on every push and pull request: rustfmt, clippy -D warnings and every
# test (the test ROM suites included, fetched from their releases) for each system inkdot builds
# for (nibOS, nibOS with DSlot, the stock OS, a computer), and shellcheck. nibkit comes from its
# own repository, as Cargo.toml says.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev shellcheck unzip
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/roms
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/fetch-test-roms.sh') }}
      - name: make check
        run: make check
